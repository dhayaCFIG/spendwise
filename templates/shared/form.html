{% extends "base.html" %}{% block content %}<a href="{{ back }}" class="text-decoration-none">← Back</a><h1 class="my-3">{{ title }}</h1><div class="card border-0 shadow-sm"><div class="card-body p-4"><form method="post">{% csrf_token %}<div class="row g-3">{% for field in form %}<div class="col-md-6"><label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}</div><button class="btn btn-primary mt-4">Save</button> <a class="btn btn-light border mt-4" href="{{ back }}">Cancel</a></form></div></div>{% endblock %}
